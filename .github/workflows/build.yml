name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :socks-core:test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SocksTether-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the builds-apk branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/SocksTether-debug.apk
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git checkout --orphan builds-apk
          git rm -rf . -q
          cp /tmp/SocksTether-debug.apk .
          git add SocksTether-debug.apk
          git commit -qm "APK from ${GITHUB_SHA}"
          git push -f origin builds-apk
