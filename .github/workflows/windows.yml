name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Core tests
        run: python -m unittest test_core -v
        working-directory: windows
        continue-on-error: true
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name SocksTether app.py
        working-directory: windows
      - uses: actions/upload-artifact@v4
        with:
          name: SocksTether-windows
          path: windows/dist/SocksTether.exe
      - name: Publish exe to the builds-windows branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cp windows/dist/SocksTether.exe /tmp/SocksTether.exe
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git checkout --orphan builds-windows
          git rm -rf . -q
          cp /tmp/SocksTether.exe .
          git add SocksTether.exe
          git commit -qm "exe from ${GITHUB_SHA}"
          git push -f origin builds-windows
